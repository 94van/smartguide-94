name: 问题反馈
description: 报告导诊、路线或界面问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "请只使用模拟数据，勿上传真实患者信息、密钥或医院内部资料。"
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 起点、终点、楼层、通行设置、具体操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 浏览器、设备、系统和版本
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我确认内容只包含虚构演示数据，没有密钥或个人资料。
          required: true
